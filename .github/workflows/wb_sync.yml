name: WB Stock Sync

on:
  schedule:
    - cron: '0 * * * *' # Запускать каждый час (в 00 минут)
  workflow_dispatch: # Позволяет запустить вручную из вкладки Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WB API script
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
        run: python wb_api.py